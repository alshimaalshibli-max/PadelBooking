name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Backend dependencies
        run: dotnet restore backend/PadelBooking.API.Tests/PadelBooking.API.Tests.csproj

      - name: Build Backend
        run: dotnet build backend/PadelBooking.API.Tests/PadelBooking.API.Tests.csproj --configuration Release --no-restore

      - name: Test Backend
        run: dotnet test backend/PadelBooking.API.Tests/PadelBooking.API.Tests.csproj --configuration Release --no-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  build-container:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: padel-booking:ci
